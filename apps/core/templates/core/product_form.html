{% extends "core/base.html" %}


{% block title %}
{% if form.instance.pk %}
Edit Product
{% else %}
Add Product
{% endif %}
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h1 class="mb-4">

                    {% if form.instance.pk %}
                    Edit Product
                    {% else %}
                    Add Product
                    {% endif %}

                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-3">

                        <button type="submit" class="btn btn-success">
                            Save
                        </button>

                        <a href="{% url 'product_list' %}" class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
